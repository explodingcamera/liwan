name: Audit dependencies

on:
  pull_request:
    paths:
      - ".github/workflows/audit.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**/package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**/package.json"
      - "bun.lock"
  schedule:
    # Daily at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-26.04
      upload-sarif: false
      scan-args: |-
        --lockfile=./Cargo.lock
        --lockfile=./bun.lock

  scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-26.04
      fail-on-vuln: false
      scan-args: |-
        --lockfile=./Cargo.lock
        --lockfile=./bun.lock
