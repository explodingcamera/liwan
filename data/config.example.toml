base_url = "http://localhost:9042"  # The base URL of the Liwan instance
listen = 9042  # The port to listen on (http)

## Disable favicon fetching from the DuckDuckGo API.
# disable_favicons = false

## Folder to store the database in (Will be created if it doesn't exist)
## defaults to $HOME/.local/share/liwan/data on linux/macos
## defaults to ./liwan-data on other platforms
# data_dir="./liwan-data"

## Trusted client IP headers (used in order), defaults to X-Forwarded-For.
## Presets: cloudflare, fastly, fly, cloudfront, akamai.
## Provider presets can be combined with standard or custom headers.
# trusted_headers = ["X-Forwarded-For"]

## Trusted reverse proxies (IP or CIDR), defaults to the IPv4 and IPv6 loopback ranges.
## Use "*" to trust all direct peers only when network access to liwan is restricted.
# trusted_proxies = ["127.0.0.1/8", "::1/128"]

## Hour of day, in the server's local timezone, when visitor grouping salts rotate.
## Defaults to 4, meaning 4am local time.
# visitor_group_rotation_hour=4

[geoip]  # GeoIp settings (Optional)
## MaxMind account ID and license key
## Required to automatically download the database and keep it up to date
# maxmind_account_id="MY_ACCOUNT_ID"
# maxmind_license_key="MY_LICENSE_KEY"
# maxmind_edition="GeoLite2-City"

## If you don't want to automatically download the database, you can specify a path to a local file
## Otherwise, the database will be downloaded automatically and stored in the data_dir
# maxmind_db_path="./GeoLite2-City.mmdb"

## Read location data supplied by a trusted proxy.
## Presets: akamai, cloudflare, cloudfront, netlify, vercel.
## Multiple presets and custom mappings are also supported, in priority order:
# headers=["cloudflare", { country="X-Country", city="X-City" }]
# headers="cloudflare"

[duckdb]  # Database settings
## See https://liwan.dev/guides/duckdb for guidance
# threads=2
# memory_limit=2G

[limits]  # Resource limits
# report_timeout_seconds=30
# report_max_concurrency=8
# report_max_range_days=3660
# report_max_dimension_results=1000
# report_max_datapoints=2000
# report_max_filters=20
# report_max_filter_value_bytes=2048
