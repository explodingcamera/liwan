[package]
name = "liwan-api"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust client for the Liwan API"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["ipnet"]

[features]
default = ["jiff"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
reqwest = ["dep:reqwest"]
tokio = ["dep:tokio"]
tower = ["dep:tower"]

[[example]]
name = "background_job"
required-features = ["reqwest", "tokio"]

[[example]]
name = "axum"
required-features = ["reqwest", "tokio", "tower"]

[dependencies]
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["now"], optional = true }
futures-lite = "2"
futures-timer = "3"
http = "1"
ipnet = "2"
jiff = { version = "1.0", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
