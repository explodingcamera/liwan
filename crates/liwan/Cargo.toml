[package]
name = "liwan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["md-5"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "liwan"
path = "src/main.rs"

[[bench]]
harness = false
name = "reports"

[dependencies]
# async/concurrency
arc-swap = "1.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quick_cache = { version = "0.7" }
tokio = { version = "1.54", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "time"] }

# encoding
base64 = "0.23"
md-5 = { version = "0.11.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
subtle = { version = "2.6", default-features = false }
tar-codec = "0.0.17"
zstd = { version = "0.14", default-features = false }

# general
ahash = "0.8"
aide = { version = "0.16.0-alpha.4", default-features = false, features = [
  "axum",
  "axum-extra-cookie",
  "axum-json",
  "axum-query",
] }
anyhow = { version = "1.0" }
argh = { version = "0.1", default-features = false, features = ["help"] }
argon2 = { version = "0.6.0", features = [] }
async-compression = { version = "0.4", default-features = false, features = ["gzip", "tokio"] }
blake3 = { version = "1.8" }
config = { version = "0.15", default-features = false, features = ["toml"] }
jiff = { version = "1.0.3", default-features = false, features = ["serde", "std", "tz-system", "tzdb-bundle-always"] }
nix = { version = "0.32", features = ["user"] }
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# web
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "original-uri",
  "query",
  "tokio",
] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
bottlecap-tower = { version = "0.2.0", features = ["axum"] }
http = "1.5"
ipnet = "2.12"
oauth2 = { git = "https://github.com/explodingcamera-contrib/oauth2-rs", default-features = false }
openidconnect = { git = "https://github.com/explodingcamera-contrib/openidconnect-rs", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rust-embed = { version = "8.14", features = ["mime-guess"] }
schemars = { version = "1.2", features = ["derive"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false, features = [
  "compression-zstd",
  "cors",
  "set-header",
  "timeout",
  "trace",
] }
ua-parser = "0.2"
url = "2.5"

# database
duckdb = { version = "1.20001", features = ["bundled", "r2d2"] }
maxminddb = "0.33"
mimalloc = { version = "0.1" }
r2d2 = { version = "0.8", default-features = false }
refinery = { version = "0.10", default-features = false }
refinery-core = { version = "0.10", default-features = false }
rsntp = { version = "4.1.2", default-features = false, features = ["async"] }
rusqlite = { version = "0.43", features = ["bundled", "modern_sqlite"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tempfile = { version = "3" }
tower = { version = "*", features = ["util"] }

[lints]
workspace = true
